<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AZ-400 Practice Exam</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;max-width:46rem;margin:2rem auto;padding:0 1rem}
fieldset{border:0;padding:0;margin:.5rem 0}
legend{font-weight:600;padding:0}
label{display:block;padding:.5rem .75rem;margin:.4rem 0;border:1px solid #8886;border-radius:.4rem;cursor:pointer}
.ok{border-color:#2a2;background:#2a22}
.ok::after{content:" ✓"}
.bad{border-color:#d33;background:#d332}
.bad::after{content:" ✗"}
button{font:inherit;padding:.5rem 1.2rem}
small{opacity:.7}
code{background:#8883;padding:0 .25em;border-radius:.2em}
</style>
<main id="app"></main>
<script>
const P = "Processes and communications", S = "Source control strategy", B = "Build and release pipelines",
  C = "Security and compliance", I = "Instrumentation strategy";

// The first n options (default 1) are the correct ones; options are shuffled when shown.
const Q = [
{d:P, q:"Your team tracks work in Azure Boards and stores code in GitHub. Developers must link a commit to work item 482 from the commit message. What should the message contain?",
 o:["`AB#482`", "`#482`", "`WI-482`", "`Fixes 482`"],
 e:"With the Azure Boards app for GitHub connected, `AB#{id}` in a commit, pull request or issue links it to the work item. `#482` alone refers to a GitHub issue or pull request."},
{d:P, q:"You need a dashboard widget that shows how long work items take from the moment they are created until they are completed. Which widget should you add?",
 o:["Lead Time", "Cycle Time", "Velocity", "Sprint Burndown"],
 e:"Lead time runs from work item creation to completion. Cycle time starts only when work on the item begins."},
{d:P, q:"A team wants to see where work items accumulate between board columns over time so that it can find bottlenecks. Which chart should it use?",
 o:["Cumulative flow diagram", "Velocity chart", "Sprint burndown chart", "Test results trend"],
 e:"A cumulative flow diagram shows the count of items in each column over time; a widening band indicates a bottleneck."},
{d:P, q:"Architecture documentation must be versioned together with the code, be reviewed through pull requests, and be readable in the Azure DevOps wiki. What should you do?",
 o:["Keep Markdown files in the code repository and publish them as a wiki", "Create a provisioned project wiki and edit the pages in the browser", "Attach Word documents to work items", "Store the documents in a variable group"],
 e:"Publishing code as a wiki surfaces Markdown from a repository branch, so the documentation follows the same branching and pull request process as the code."},
{d:P, q:"A wiki page must contain a sequence diagram that is stored as text so that changes can be reviewed and versioned. What should you use?",
 o:["A Mermaid diagram in a Markdown code block", "A PNG image exported from a drawing tool", "An embedded Excel workbook", "A YAML pipeline template"],
 e:"Azure DevOps wikis and GitHub render Mermaid syntax, which keeps diagrams as diffable text."},
{d:P, q:"An external incident management system must receive an HTTP POST whenever a release deployment fails in Azure DevOps. What should you configure?",
 o:["A service hook subscription that uses Web Hooks", "A personal email notification subscription", "A dashboard widget", "A build validation branch policy"],
 e:"Service hooks send Azure DevOps events to external services; the Web Hooks consumer posts the event payload to any HTTP endpoint."},
{d:P, q:"Which DORA metric measures the percentage of production deployments that cause degraded service and need remediation such as a hotfix or rollback?",
 o:["Change failure rate", "Deployment frequency", "Lead time for changes", "Time to restore service"],
 e:"Change failure rate is failed deployments divided by total deployments. Time to restore service measures how long recovery takes, not how often failures happen."},
{d:P, q:"A team wants pipeline run notifications posted in a Microsoft Teams channel and wants to approve pending deployments from Teams. What should you do?",
 o:["Install the Azure Pipelines app for Microsoft Teams and subscribe the channel to the pipeline", "Install the Azure Boards app for Microsoft Teams", "Send email notifications to the channel email address", "Add a status badge to the repository README"],
 e:"The Azure Pipelines app for Teams posts run events to a channel and lets approvers approve or reject deployments from the message."},

{d:S, q:"A team deploys to production several times a day. It wants to minimise merge conflicts and keep `main` always releasable while unfinished features stay hidden from users. Which strategy should it adopt?",
 o:["Trunk-based development with short-lived branches and feature flags", "Long-lived feature branches that are merged at each release", "GitFlow with `develop`, release and hotfix branches", "One fork per developer that is merged monthly"],
 e:"Trunk-based development integrates small changes frequently, and feature flags decouple deploying code from releasing a feature."},
{d:S, q:"Code must compile and pass unit tests before a pull request into `main` can be completed in Azure Repos. What should you configure?",
 o:["A build validation branch policy on `main`", "A continuous integration trigger on `main`", "A scheduled nightly build", "A status badge on the repository"],
 e:"A build validation policy runs a pipeline against the pull request merge result and blocks completion until it succeeds. A CI trigger only runs after the merge."},
{d:S, q:"A Git repository contains large design and video files that change often, and cloning has become slow. What should you use?",
 o:["Git Large File Storage (LFS)", "Git submodules", "A `.gitignore` entry for the files", "`git gc --aggressive`"],
 e:"Git LFS stores large binaries outside the repository and keeps small pointer files in Git, so clones download only the versions they check out."},
{d:S, q:"A repository holds millions of source files and a very long history, but no large binaries. Developers report slow clone, status and fetch operations. What should you use?",
 o:["Scalar", "Git LFS", "GitFlow", "Annotated tags"],
 e:"Scalar configures Git for very large repositories: partial clone, sparse checkout, the file system monitor and background maintenance."},
{d:S, q:"A YAML pipeline builds a repository with a very long history, and only the latest commit is needed. How should you shorten the checkout?",
 o:["Set `fetchDepth: 1` on the `checkout` step", "Set `clean: true` on the `checkout` step", "Set `persistCredentials: true` on the `checkout` step", "Set `lfs: true` on the `checkout` step"],
 e:"`fetchDepth` performs a shallow fetch that limits how many commits are downloaded."},
{d:S, q:"A file containing a password was committed and pushed three weeks ago. The password has been rotated. You must remove the file from the entire repository history. Which tool should you use?",
 o:["`git filter-repo`", "`git revert`", "`git rm`", "`git reset --soft`"],
 e:"`git filter-repo` (or BFG) rewrites history to remove the file, followed by a force push. `git revert` and `git rm` add new commits and leave the secret in earlier ones."},
{d:S, q:"`main` must contain exactly one commit for each completed pull request and have a linear history. Which merge type should the branch policy allow?",
 o:["Squash merge", "Merge (no fast-forward)", "Rebase and fast-forward", "Semi-linear merge"],
 e:"Squash merge condenses the pull request into a single commit on the target branch. Rebase and fast-forward is linear but keeps every source commit."},
{d:S, q:"In a GitHub repository, every change to files under `/infra` must be approved by the platform team before merging.", n:2,
 o:["Add a `CODEOWNERS` file that maps `/infra/` to the platform team", "Require review from code owners in the branch protection rule or ruleset for `main`", "Give the platform team the admin role on the repository", "Add an issue template for infrastructure changes", "Enable Dependabot version updates"],
 e:"`CODEOWNERS` assigns owners to paths, and the branch protection setting makes their approval mandatory."},
{d:S, q:"A developer ran `git reset --hard` and lost several local commits that were never pushed. Which command lets the developer find the hashes of the lost commits?",
 o:["`git reflog`", "`git log --oneline`", "`git stash list`", "`git fetch --all`"],
 e:"The reflog records where `HEAD` has pointed, including commits no longer reachable from any branch, so they can be restored with `git reset` or `git cherry-pick`."},

{d:B, q:"Developers consume npm packages through an Azure Artifacts feed. Every public package version they use must be saved in the feed so that it stays available even if it is removed from npmjs.com. What should you do?",
 o:["Enable npmjs.com as an upstream source on the feed", "Create an additional feed view", "Publish the packages as Universal Packages", "Add npmjs.com as a second registry in each developer's `.npmrc`"],
 e:"With an upstream source, the feed saves a copy of each package version the first time it is requested through the feed."},
{d:B, q:"A CI pipeline publishes every build of a NuGet package to an Azure Artifacts feed. Other teams must see only the versions that passed full validation. What should you do?",
 o:["Promote validated versions to the `@Release` view and have consumers use that view", "Delete every version that has not been validated", "Enable upstream sources on the feed", "Publish validated versions with a lower version number"],
 e:"Feed views (`@Local`, `@Prerelease`, `@Release`) expose a subset of package versions; promoting a version makes it visible in that view."},
{d:B, q:"A library is at version 2.4.1. The next release removes a public method that consumers use. According to Semantic Versioning, which version should it have?",
 o:["3.0.0", "2.5.0", "2.4.2", "2.4.1-beta"],
 e:"Breaking changes increment the major version. Minor is for backward-compatible features and patch for backward-compatible fixes."},
{d:B, q:"Some UI tests fail intermittently for reasons unrelated to code changes and block pull requests. You must keep pipeline results reliable while still tracking those tests. What should you do in Azure Pipelines?",
 o:["Enable flaky test detection in the project test management settings", "Set `continueOnError: true` on the test task", "Delete the affected tests", "Increase the job timeout"],
 e:"Flaky test management detects or lets you mark flaky tests and excludes them from the pass percentage while still reporting them. `continueOnError` would hide real failures too."},
{d:B, q:"A build produces a Cobertura coverage report. The Code Coverage tab of the pipeline run must show the results. Which task should you add?",
 o:["`PublishCodeCoverageResults`", "`PublishTestResults`", "`PublishPipelineArtifact`", "`CopyFiles`"],
 e:"`PublishCodeCoverageResults` publishes Cobertura or JaCoCo results to the run. `PublishTestResults` publishes pass/fail results, not coverage."},
{d:B, q:"A pipeline must deploy to servers in an on-premises network that allows no inbound connections from the internet. Which agent should run the deployment job?",
 o:["A self-hosted agent installed inside the on-premises network", "A Microsoft-hosted Ubuntu agent", "A Microsoft-hosted Windows agent", "An agentless (server) job"],
 e:"A self-hosted agent only makes outbound connections to Azure DevOps and has line of sight to the internal servers."},
{d:B, q:"You need build agents that use a custom image with preinstalled SDKs, scale out automatically with pipeline demand, and scale in when idle. What should you use?",
 o:["An agent pool backed by an Azure Virtual Machine Scale Set", "The Microsoft-hosted agent pool", "A single self-hosted agent on a large virtual machine", "A deployment group"],
 e:"Scale set agents are self-hosted agents that Azure Pipelines scales automatically from your own image. Microsoft-hosted agents cannot use a custom image."},
{d:B, q:"Every pipeline that deploys with the production service connection must include a credential scanning step that pipeline authors cannot remove. What should you do?",
 o:["Put the step in a template that pipelines extend, and add a Required template check to the service connection", "Document the requirement in the project wiki", "Add the step to a task group and ask teams to use it", "Store the scanning tool in a variable group"],
 e:"An `extends` template controls the structure of the pipeline, and the Required template check stops any run that uses the resource without extending that template."},
{d:B, q:"The YAML pipeline `Deploy` must start automatically each time the YAML pipeline `Build` completes on `main`. What should you add to `Deploy`?",
 o:["A `pipelines` resource that references `Build` and defines a `trigger`", "A `schedules` entry with a cron expression", "A `pr` trigger for `main`", "A `repositories` resource that references the `Build` repository"],
 e:"A pipeline resource trigger starts a pipeline when another pipeline completes, and gives access to its artifacts."},
{d:B, q:"A monorepo contains `/web` and `/api`. The API pipeline must start only when files under `/api` change on `main`. What should you do?",
 o:["Add a `paths` filter that includes `api` to the pipeline `trigger`", "Add a `condition` to every step in the pipeline", "Add a demand to the agent pool", "Move the API code to a long-lived branch"],
 e:"Path filters on the CI trigger limit which changes start a run. A step condition would still start the pipeline and use an agent."},
{d:B, q:"A nightly build must run at 02:00 UTC even when the code has not changed since the last scheduled run. What should you define?",
 o:["A `schedules` cron entry with `always: true`", "A `schedules` cron entry with `always: false`", "A CI trigger with `batch: true`", "`trigger: none`"],
 e:"By default a scheduled run is skipped when there are no source changes since the last scheduled run; `always: true` overrides this."},
{d:B, q:"Several pipelines use the same database password. It is stored in Azure Key Vault and rotated monthly. Pipelines must always use the current value without anyone copying it. What should you do?",
 o:["Create a variable group linked to the key vault and reference it from the pipelines", "Define a secret variable in each pipeline", "Store the password Base64-encoded in the YAML file", "Upload the password as a secure file"],
 e:"A Key Vault-linked variable group fetches the latest secret values at run time, so rotation needs no pipeline change."},
{d:B, q:"A YAML template must include a group of steps only when the `runTests` parameter is true. The decision must be made when the pipeline is compiled. Which syntax should you use?",
 o:["`${{ if eq(parameters.runTests, true) }}`", "`$[ eq(variables.runTests, true) ]`", "`$(runTests)`", "`%RUNTESTS%`"],
 e:"`${{ }}` template expressions are evaluated at compile time and can insert or omit YAML. `$[ ]` is evaluated at run time and `$( )` is macro substitution just before a task runs."},
{d:B, q:"A script in job `A` calculates a version number that job `B` needs.", n:2,
 o:["In a named step of job `A`, set the variable with `##vso[task.setvariable variable=ver;isOutput=true]`", "In job `B`, add `dependsOn: A` and map `$[ dependencies.A.outputs['setVer.ver'] ]` to a variable", "Reference `$(ver)` directly in job `B`", "Export the value as a shell environment variable in job `A`", "Declare `ver` under `parameters`"],
 e:"Variables are scoped to a job. An output variable must be marked `isOutput=true` and then mapped in the dependent job through `dependencies`."},
{d:B, q:"A multi-stage YAML pipeline must wait for approval from the operations team before the production stage runs. What should you do?",
 o:["Add an Approvals check to an environment and target that environment from a deployment job", "Add an `approvals` property to the stage in the YAML file", "Set `condition: succeeded()` on the production stage", "Add a minimum number of reviewers branch policy on `main`"],
 e:"In YAML pipelines, approvals are checks defined on resources such as environments, not in the YAML file, so pipeline authors cannot bypass them."},
{d:B, q:"A new version must first be released to 5 percent of users, be monitored, and then be rolled out gradually to everyone. Which deployment strategy is this?",
 o:["Canary", "Blue-green", "Recreate", "Rolling"],
 e:"A canary release exposes a small share of users to the new version and widens exposure as confidence grows."},
{d:B, q:"An Azure App Service app has `production` and `staging` slots. After a swap, the staging slot must still use the test database. What should you do?",
 o:["Mark the connection string as a deployment slot setting", "Enable auto swap on the staging slot", "Store the connection string in the deployment package", "Scale out the staging slot"],
 e:"Deployment slot settings are sticky: they stay with the slot instead of moving with the app during a swap."},
{d:B, q:"Before swapping, you want 10 percent of production traffic for an Azure App Service app to reach the new version that runs in the `staging` slot. What should you do?",
 o:["Set the traffic routing percentage of the staging slot to 10", "Perform a swap with preview", "Enable auto swap on the staging slot", "Scale the staging slot to one tenth of the production instances"],
 e:"Deployment slot traffic routing (testing in production) sends a chosen percentage of requests to a non-production slot."},
{d:B, q:"Product owners must enable a new feature for selected customers and disable it instantly without a redeployment. What should you use?",
 o:["Feature flags managed in Azure App Configuration", "A deployment slot per customer", "A release branch per customer", "ARM template parameters"],
 e:"The App Configuration feature manager stores flags centrally, supports targeting filters, and lets apps pick up changes at run time."},
{d:B, q:"Before deploying a Bicep file to a production resource group, you must see which resources would be created, changed or deleted, without making any change. Which command should you run?",
 o:["`az deployment group what-if`", "`az deployment group validate`", "`az bicep build`", "`az deployment group create --mode Complete`"],
 e:"What-if previews the changes a deployment would make. `validate` only checks that the template is valid, and `bicep build` only compiles to ARM JSON."},
{d:B, q:"An ARM template deployment must delete any resource in the resource group that is not defined in the template. What should you use?",
 o:["Complete deployment mode", "Incremental deployment mode", "A what-if operation", "A CanNotDelete resource lock"],
 e:"Complete mode removes resources that exist in the resource group but not in the template. Incremental mode, the default, leaves them unchanged."},
{d:B, q:"You must audit and enforce operating system settings inside Azure VMs and Azure Arc-enabled servers, and report compliance through Azure Policy. What should you use?",
 o:["Azure Machine Configuration", "Azure Deployment Environments", "The Custom Script Extension", "Azure App Configuration"],
 e:"Azure Machine Configuration (formerly Azure Policy guest configuration) audits and applies in-guest settings as code on Azure and Arc-enabled machines."},
{d:B, q:"Development teams must be able to create application infrastructure on demand from a catalog of infrastructure-as-code templates approved by the platform team, within governed projects. What should you use?",
 o:["Azure Deployment Environments", "Azure Machine Configuration", "Azure Automation State Configuration", "Azure Artifacts"],
 e:"Azure Deployment Environments gives developers self-service environments created from catalog templates, with subscriptions, identities and permissions controlled by the platform team."},
{d:B, q:"Several GitHub repositories repeat the same build and test jobs. You want to define the jobs once and call them from each repository's workflow. What should you create?",
 o:["A reusable workflow that is triggered by `workflow_call`", "A workflow that is triggered by `workflow_dispatch`", "A workflow that is triggered by `repository_dispatch`", "A workflow that is triggered by `schedule`"],
 e:"A reusable workflow declares `on: workflow_call` and is referenced with `uses:` at job level in the caller workflow."},
{d:B, q:"A GitHub Actions workflow must run the same test job on Ubuntu, Windows and macOS against three Node.js versions without duplicating the job. What should you use?",
 o:["`strategy.matrix`", "`needs`", "`concurrency`", "`services`"],
 e:"A matrix strategy creates one job run for each combination of the listed variables."},
{d:B, q:"Each run of a pipeline spends several minutes restoring the same npm packages. You must shorten the runs without changing the dependencies. What should you do?",
 o:["Add the `Cache@2` task with a key based on `package-lock.json`", "Publish `node_modules` as a pipeline artifact in every run", "Increase the job timeout", "Set `fetchDepth: 0` on the `checkout` step"],
 e:"Pipeline caching restores the package cache from an earlier run when the key, here the lock file hash, is unchanged."},
{d:B, q:"Container images in Azure Container Registry must be rebuilt automatically when their base image receives operating system patches. What should you configure?",
 o:["An ACR task with a base image update trigger", "Geo-replication of the registry", "A retention policy for untagged manifests", "A repository-scoped token"],
 e:"ACR Tasks track base image dependencies and can trigger a rebuild when the base image is updated."},
{d:B, q:"A YAML pipeline must deploy a web application to 20 virtual machines, updating a few at a time so that the application stays available. What should you do?",
 o:["Register the VMs as resources in an environment and use a deployment job with the `rolling` strategy", "Use a deployment job with the `runOnce` strategy on a Microsoft-hosted agent", "Add the VMs to a variable group", "Create one stage per VM and run all the stages in parallel"],
 e:"The rolling strategy on an environment with virtual machine resources updates a fixed number or percentage of targets in each iteration."},
{d:B, q:"A production deployment may proceed only if no Azure Monitor alerts are active for the application after the staging deployment. Which check should you add to the production environment?",
 o:["Query Azure Monitor alerts", "Business hours", "Exclusive lock", "Required template"],
 e:"The Query Azure Monitor alerts check evaluates alert rules and holds the stage until they are healthy."},
{d:B, q:"Several runs of a YAML pipeline are queued. Two runs must never deploy to the production environment at the same time. What should you add to the environment?",
 o:["An Exclusive lock check", "A Business hours check", "An Approvals check with a single approver", "A Required template check"],
 e:"The exclusive lock check lets only one run at a time use the resource; `lockBehavior` controls whether waiting runs queue sequentially or only the latest proceeds."},

{d:C, q:"A pipeline deploys to Azure through a service connection whose service principal secret expires and has to be rotated by hand. You must remove the need to manage any secret. What should you do?",
 o:["Convert the service connection to workload identity federation", "Extend the secret lifetime to two years", "Store the secret in a variable group", "Replace the service connection with a personal access token"],
 e:"Workload identity federation uses a trust between Microsoft Entra ID and Azure DevOps to issue short-lived tokens, so no secret is stored or rotated."},
{d:C, q:"A GitHub Actions workflow must sign in to Azure without any long-lived credential stored in GitHub.", n:2,
 o:["Add a federated credential for the repository to the Microsoft Entra application or managed identity", "Grant the workflow the `id-token: write` permission and sign in with `azure/login` using the client, tenant and subscription IDs", "Store the client secret as a repository secret", "Store a publish profile as an environment secret", "Store a personal access token as an organization secret"],
 e:"With OpenID Connect, GitHub issues a token for the workflow run, and Microsoft Entra ID exchanges it for an access token based on the federated credential."},
{d:C, q:"An app on Azure App Service reads secrets from Azure Key Vault. No credential may be stored in code or in app settings. What should you do?",
 o:["Enable a managed identity for the app and grant it access to the key vault", "Create a service principal and store its client secret in app settings", "Store the secrets in the repository in an encrypted file", "Use a shared access signature token"],
 e:"A managed identity is an Azure-managed identity for the app, so it can authenticate to Key Vault without any stored credential."},
{d:C, q:"You must stop developers from pushing commits that contain credentials to GitHub repositories. What should you enable?",
 o:["Secret scanning with push protection", "Dependabot alerts", "Code scanning with CodeQL", "A `CODEOWNERS` file"],
 e:"Push protection scans pushes for supported secret types and blocks them before the secret reaches the repository."},
{d:C, q:"A GitHub repository must automatically receive pull requests that upgrade dependencies with known vulnerabilities to a patched version. What should you enable?",
 o:["Dependabot security updates", "Secret scanning", "Code scanning with CodeQL", "The dependency review action"],
 e:"Dependabot security updates open pull requests for vulnerable dependencies. Dependency review only reports vulnerable dependencies introduced by a pull request."},
{d:C, q:"Each pull request in a GitHub repository must be analysed for vulnerabilities in the source code, such as SQL injection. What should you configure?",
 o:["Code scanning with CodeQL", "Dependabot version updates", "Secret scanning", "Required signed commits"],
 e:"CodeQL performs static analysis of the code itself. Dependabot covers third-party dependencies and secret scanning covers credentials."},
{d:C, q:"A Bash step in a YAML pipeline reads the secret variable `apiKey`, but `$APIKEY` is empty at run time. What should you do?",
 o:["Map the secret to an environment variable in the `env` section of the step", "Mark the variable as read-only", "Set `isOutput=true` on the variable", "Rename the variable to uppercase"],
 e:"Secret variables are not exposed to scripts as environment variables automatically; each step that needs one must map it explicitly."},
{d:C, q:"A build needs a code-signing certificate file. The file must not be in the repository and must be usable only by authorised pipelines. What should you do?",
 o:["Upload the file as a secure file in the Library and use the `DownloadSecureFile` task", "Commit the file to a branch that only administrators can read", "Publish the file as a pipeline artifact", "Paste the file content into a non-secret pipeline variable"],
 e:"Secure files are stored encrypted, can be restricted with pipeline permissions and checks, and are downloaded to the agent only for the run."},
{d:C, q:"The security team wants one place to view code, secret and infrastructure-as-code findings across Azure DevOps and GitHub. What should you use?",
 o:["DevOps security in Microsoft Defender for Cloud", "Application Insights", "Azure Advisor", "Azure DevOps Analytics views"],
 e:"Defender for Cloud connects to Azure DevOps, GitHub and GitLab and shows the security posture of repositories and pipelines in one view."},
{d:C, q:"A service that integrates with a GitHub organization needs API access that is not tied to a user account, uses short-lived tokens and has fine-grained permissions. What should you use?",
 o:["A GitHub App", "A classic personal access token of an organization owner", "A deploy key", "An OAuth app"],
 e:"A GitHub App acts as its own identity with granular permissions and installation tokens that expire after an hour. Personal access tokens and OAuth apps act as a user."},

{d:I, q:"A microservices application is slow. You need a visual view of its components, their dependencies, and where failures and latency occur. What should you use?",
 o:["Application Map in Application Insights", "Azure Advisor", "Azure Service Health", "The Azure activity log"],
 e:"Application Map builds a topology from distributed tracing telemetry and shows call volume, latency and failure rate for each dependency."},
{d:I, q:"Which KQL query returns the number of failed requests per operation during the last hour in Application Insights?",
 o:["`requests | where timestamp > ago(1h) and success == false | summarize count() by operation_Name`", "`requests | where timestamp > ago(1h) | project operation_Name`", "`exceptions | take 100`", "`requests | summarize avg(duration) by bin(timestamp, 1h)`"],
 e:"`where` filters to failed requests in the time range, and `summarize count() by` groups the count by operation name."},
{d:I, q:"You must monitor CPU and memory use of the nodes and containers in an Azure Kubernetes Service cluster and collect container logs. What should you enable?",
 o:["Container insights", "VM insights", "Application Insights availability tests", "Network Watcher"],
 e:"Container insights collects performance metrics and logs from AKS nodes, controllers and containers."},
{d:I, q:"When an Azure Monitor alert fires, the on-call engineer must receive an SMS message and a webhook must create a ticket. What should you configure?",
 o:["An action group", "A diagnostic setting", "A data collection rule", "A workbook"],
 e:"An action group defines the notifications and actions that an alert rule triggers."},
{d:I, q:"You must be alerted when the public endpoint of a web app stops responding from several geographic locations. What should you configure?",
 o:["An Application Insights availability test", "Live Metrics", "Application Insights Profiler", "Snapshot Debugger"],
 e:"Availability tests send requests to an endpoint from multiple locations at regular intervals and can alert on failures."},
{d:I, q:"Application Insights ingestion costs are too high for a high-traffic application, but metrics must stay statistically accurate. What should you do?",
 o:["Configure sampling", "Increase the data retention period", "Turn off Live Metrics", "Create a second Application Insights resource for the same app"],
 e:"Sampling keeps a representative share of telemetry and adjusts the counts, which lowers ingestion volume while keeping metrics approximately correct."},
{d:P, q:"You must add a custom field and a new workflow state to user stories in a project that uses the Agile process. What should you do first?",
 o:["Create an inherited process from Agile and change the project to use it", "Edit the system Agile process", "Create a new organization", "Add the field to a variable group"],
 e:"System processes are locked. Customisations are made in an inherited process, and the project is switched to that process."},
{d:P, q:"Three teams share one Azure DevOps project. Each team's backlog and board must show only that team's work items. What should you configure?",
 o:["A separate area path for each team", "A separate iteration path for each team", "A tag for each team", "A dashboard for each team"],
 e:"A team's backlog shows the work items under the area paths assigned to the team. Iteration paths define sprints, not ownership."},
{d:P, q:"Management wants a calendar view of what several teams plan to deliver across upcoming sprints, including dependencies between work items of different teams. What should you use?",
 o:["Delivery Plans", "A sprint burndown chart", "A cumulative flow diagram", "A team velocity chart"],
 e:"Delivery Plans shows the backlogs of multiple teams on a shared timeline and highlights dependencies."},
{d:P, q:"A team wants to forecast how many story points it can take into future sprints, based on what it completed in previous sprints. Which chart should it use?",
 o:["Velocity", "Cumulative flow diagram", "Lead Time", "Sprint burndown"],
 e:"The velocity chart shows the work completed in each sprint, which is the basis for forecasting."},
{d:P, q:"During a sprint, the team wants to check each day whether the remaining work is on track to reach zero by the sprint end date. Which chart should it use?",
 o:["Sprint burndown", "Velocity", "Cycle Time", "Delivery Plans"],
 e:"A sprint burndown plots remaining work against the days of the sprint and compares it with the ideal trend."},
{d:P, q:"Release notes for a GitHub repository must be generated automatically from merged pull requests and grouped by label. What should you do?",
 o:["Use automatically generated release notes and define the categories in `.github/release.yml`", "Add a `CODEOWNERS` file", "Add an issue template", "Enable GitHub Discussions"],
 e:"GitHub can generate release notes from merged pull requests; `.github/release.yml` defines label-based categories and exclusions."},
{d:P, q:"The README of a repository must always show whether the latest pipeline run on `main` succeeded. What should you add?",
 o:["A pipeline status badge", "A service hook", "A dashboard widget", "A wiki page"],
 e:"A status badge is an image URL that reflects the result of the latest run for a branch."},
{d:P, q:"Stakeholders without access to the code must review a deployed web application and submit feedback with screenshots and notes that become work items. What should they use?",
 o:["The Test & Feedback browser extension", "A pull request comment", "An Application Insights availability test", "A pipeline status badge"],
 e:"The Test & Feedback extension captures screenshots and notes during exploratory testing and creates bugs, tasks or feedback responses from them."},
{d:P, q:"Business users need to view and create work items in Azure Boards. They need no access to repositories or pipelines, and licence cost must be minimised. Which access level should you assign?",
 o:["Stakeholder", "Basic", "Basic + Test Plans", "Visual Studio Enterprise subscriber"],
 e:"Stakeholder access is free and covers basic work tracking. Basic adds Repos, Pipelines and the full Boards features."},
{d:P, q:"Which DORA metric measures the time from a code change being committed until it runs successfully in production?",
 o:["Lead time for changes", "Deployment frequency", "Change failure rate", "Time to restore service"],
 e:"Lead time for changes measures how quickly a commit reaches production. Deployment frequency measures how often you deploy."},
{d:P, q:"A team wants to plan and track issues and pull requests from several GitHub repositories in one place, with custom fields, a board view and a roadmap view. What should it use?",
 o:["GitHub Projects", "A milestone", "GitHub Discussions", "A repository wiki"],
 e:"A GitHub project can span repositories and offers table, board and roadmap layouts with custom fields. A milestone belongs to a single repository."},
{d:P, q:"Code is in GitHub and work is tracked in Azure Boards. Work item 731 must move to a completed state automatically when the pull request that fixes it is merged into the default branch. What should the pull request description contain?",
 o:["`Fixes AB#731`", "`AB#731`", "`Closes #731`", "`Resolves WI731`"],
 e:"`AB#731` alone only links the work item. Adding `fix`, `fixes` or `fixed` in front also transitions it when the pull request is merged."},

{d:S, q:"External contributors without write access must be able to propose changes to an open-source GitHub repository. Which workflow should they use?",
 o:["Fork the repository and open a pull request from the fork", "Push a feature branch to the repository", "Push directly to `main`", "Add a deploy key to the repository"],
 e:"A fork is a copy the contributor owns. A pull request from the fork proposes the change without write access to the upstream repository."},
{d:S, q:"A product ships a new version every few months and must keep older versions in production supplied with fixes. Which branching approach fits best?",
 o:["A release branch for each supported version, with fixes brought in from `main`", "A single `main` branch and no other branches", "One long-lived branch per developer", "One long-lived branch per feature that is never merged"],
 e:"A release branch per supported version lets you patch that version on its own while new work continues on `main`."},
{d:S, q:"In Azure Repos, approvals on a pull request must not stay valid after new commits are pushed to the source branch. What should you configure in the branch policy?",
 o:["Reset code reviewer votes when there are new changes", "Allow requestors to approve their own changes", "Check for comment resolution", "Limit merge types"],
 e:"The reset option under the minimum number of reviewers policy removes existing votes when the source branch changes."},
{d:S, q:"In Azure Repos, every pull request into `main` that changes files under `/database` must be approved by the DBA group. What should you configure?",
 o:["An automatically included reviewers policy with a path filter, set as required", "A `CODEOWNERS` file in the repository root", "A build validation policy", "A check for linked work items policy"],
 e:"The automatically included reviewers policy adds reviewers when matching paths change and can make their approval required. Azure Repos does not use `CODEOWNERS` files."},
{d:S, q:"All commits merged into `main` in a GitHub repository must be cryptographically verifiable as coming from their author. What should you enable?",
 o:["Require signed commits in the branch protection rule or ruleset", "Require linear history", "Require conversation resolution before merging", "Secret scanning"],
 e:"With required signed commits, only commits with a verified GPG, SSH or S/MIME signature can be pushed to the branch."},
{d:S, q:"A linter must run on each developer's machine before a commit is created, and the commit must be rejected if the linter fails. Which Git hook should you use?",
 o:["`pre-commit`", "`post-commit`", "`pre-receive`", "`post-merge`"],
 e:"`pre-commit` runs locally before the commit is created and aborts it on a non-zero exit code. `pre-receive` is a server-side hook."},
{d:S, q:"A single bug-fix commit on `main` must be applied to `release/1.0` without bringing in any other change from `main`. Which command should you use?",
 o:["`git cherry-pick`", "`git merge`", "`git rebase`", "`git revert`"],
 e:"`git cherry-pick` applies the change of one commit onto the current branch as a new commit."},
{d:S, q:"A repository must include a shared library that is maintained in another repository, pinned to a specific commit of that library. What should you use?",
 o:["A Git submodule", "Git LFS", "A sparse checkout", "A shallow clone"],
 e:"A submodule embeds another repository at a recorded commit, so the parent repository controls which version it uses."},
{d:S, q:"In a large monorepo, a developer works only in `services/payments` and wants only that directory in the working tree. What should the developer use?",
 o:["`git sparse-checkout`", "`git stash`", "`git submodule`", "`git cherry-pick`"],
 e:"Sparse checkout limits the working tree to selected directories while the repository stays one unit."},
{d:S, q:"In an emergency, release managers must be able to complete a pull request into `main` even if a branch policy is not met. Other users must stay bound by the policies. What should you do?",
 o:["Grant release managers the Bypass policies when completing pull requests permission on the branch", "Disable the branch policies during emergencies", "Grant release managers the Force push permission", "Add release managers to the Readers group"],
 e:"The bypass permission lets selected users override policies at completion, and each use is recorded on the pull request."},
{d:S, q:"A branch in Azure Repos was deleted by mistake two days ago, and nobody has a local copy. How can you recover it?",
 o:["Search for the exact branch name on the Branches page and restore it from the deleted branches results", "Run `git fetch --prune`", "Create a new branch with the same name", "Run `git gc`"],
 e:"Azure Repos keeps deleted branches. Searching for the exact name lists them with a restore option."},
{d:S, q:"A regression appeared somewhere in the last 500 commits. You know one good commit and one bad commit. Which command finds the commit that introduced the regression with the fewest tests?",
 o:["`git bisect`", "`git blame`", "`git log --grep`", "`git diff`"],
 e:"`git bisect` runs a binary search between the good and the bad commit, so about nine tests cover 500 commits."},
{d:S, q:"Every new pull request in an Azure Repos repository must start with the same checklist in its description. What should you do?",
 o:["Add a `pull_request_template.md` file to the `.azuredevops` folder of the default branch", "Add the checklist to the project wiki", "Add a build validation policy", "Add the checklist to the repository description"],
 e:"Azure Repos applies a default pull request template found in `.azuredevops`, `.vsts`, `docs` or the root of the default branch."},
{d:B, q:"After the `Build` stage, the stages `Test_EU` and `Test_US` must run in parallel. What should you do?",
 o:["Set `dependsOn: Build` on both test stages", "Set `dependsOn: Test_EU` on `Test_US`", "Remove `dependsOn` from all stages", "Add a `condition: always()` to both test stages"],
 e:"Without `dependsOn`, stages run one after another in file order. Stages that depend on the same stage and not on each other run in parallel."},
{d:B, q:"The `Deploy` stage must run only when the earlier stages succeeded and the run is for the `main` branch. Which condition should you use?",
 o:["`and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))`", "`eq(variables['Build.SourceBranch'], 'main')`", "`or(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))`", "`always()`"],
 e:"`Build.SourceBranch` holds the full ref name, and `and(succeeded(), ...)` keeps the requirement that earlier stages succeeded."},
{d:B, q:"A cleanup step must run even when an earlier step fails or the run is cancelled. Which condition should the step have?",
 o:["`always()`", "`succeededOrFailed()`", "`failed()`", "`succeeded()`"],
 e:"`always()` runs even after cancellation. `succeededOrFailed()` runs after a failure but not when the run is cancelled."},
{d:B, q:"Shared YAML templates live in a central repository named `templates`. Pipelines in other repositories must use them. What should those pipelines do?",
 o:["Declare `templates` as a repository resource and reference the files as `file.yml@templates`", "Copy the template files into each repository", "Add `templates` as a variable group", "Add a pipeline resource trigger for `templates`"],
 e:"A repository resource gives the pipeline an alias for another repository, and `@alias` after the template path loads the file from it."},
{d:B, q:"On Microsoft-hosted agents, the steps of a job must run inside a specific Docker image that contains the build toolchain. What should you use?",
 o:["A container job that sets `container` to the image", "A service container", "A deployment group", "A demand on the agent pool"],
 e:"A container job runs its steps inside the given container on the agent host. A service container runs next to the job to provide a service such as a database."},
{d:B, q:"Integration tests in a pipeline job need a Redis instance that exists only while the job runs. What should you use?",
 o:["A service container", "A secure file", "A deployment job", "A variable group"],
 e:"Service containers are started before the job's steps and removed when the job ends."},
{d:B, q:"A job must run only on self-hosted agents that have a licensed tool installed. The agents advertise the capability `LicensedTool`. What should you add to the job?",
 o:["A `demands` entry for `LicensedTool` under `pool`", "A `condition` that checks `LicensedTool`", "A `dependsOn` entry for `LicensedTool`", "A variable named `LicensedTool`"],
 e:"Demands are matched against agent capabilities, so the job is sent only to agents that satisfy them."},
{d:B, q:"A pipeline must pause mid-run until a person confirms a configuration, without occupying an agent while it waits. What should you use?",
 o:["The `ManualValidation` task in an agentless job", "A script step that sleeps on a Microsoft-hosted agent", "A `condition: failed()` on the next job", "A scheduled trigger"],
 e:"`ManualValidation` runs in an agentless job (`pool: server`) and waits for a user to resume or reject the run."},
{d:B, q:"A test suite takes 60 minutes on one agent. You want to split the tests over five agents that run at the same time. What should you set on the job?",
 o:["`parallel: 5` under `strategy`", "`timeoutInMinutes: 12`", "`dependsOn` with five entries", "`pool: server`"],
 e:"The parallel strategy runs copies of the job on several agents, and the test task slices the tests across them."},
{d:B, q:"The `Build` stage produces binaries that the `Deploy` stage of the same pipeline needs. What should you do?",
 o:["Publish the binaries as a pipeline artifact and download it in `Deploy`", "Store the binaries in a variable group", "Store the binaries with the `Cache` task", "Upload the binaries as a secure file"],
 e:"Each job starts with a fresh workspace, so files are passed between stages as pipeline artifacts. Deployment jobs download them automatically."},
{d:B, q:"In a classic release pipeline, the QA lead must sign off before the Production stage starts deploying. What should you configure?",
 o:["A pre-deployment approval on the Production stage", "A post-deployment approval on the Production stage", "A continuous deployment trigger on the artifact", "A scheduled release trigger"],
 e:"Pre-deployment approvals are evaluated before a stage begins. Post-deployment approvals are evaluated after it finishes."},
{d:B, q:"A classic release pipeline must deploy an application to ten on-premises servers and run the deployment tasks on each server. What should you use?",
 o:["A deployment group with an agent installed on each server", "A single Microsoft-hosted agent", "An agentless job", "A variable group for each server"],
 e:"A deployment group is a set of target machines that each run an agent, so the tasks execute on the targets themselves."},
{d:B, q:"In a deployment job, rollback steps must run only when the deployment steps fail. Where should you put them?",
 o:["In the `on: failure` lifecycle hook", "In the `preDeploy` lifecycle hook", "In the `routeTraffic` lifecycle hook", "In the `on: success` lifecycle hook"],
 e:"Deployment strategies provide the hooks `preDeploy`, `deploy`, `routeTraffic`, `postRouteTraffic`, `on: failure` and `on: success`."},
{d:B, q:"Kubernetes manifests for an application must be packaged as a versioned unit, with values that differ per environment. What should you use?",
 o:["A Helm chart", "A Dockerfile", "An ARM template", "A NuGet package"],
 e:"A Helm chart packages templated manifests under a version, and values files supply the settings for each environment."},
{d:B, q:"Two identical production environments exist. The new version is deployed to the idle one and tested, then all traffic is switched to it, and the old one is kept for immediate rollback. Which strategy is this?",
 o:["Blue-green deployment", "Canary release", "Rolling deployment", "Feature toggling"],
 e:"Blue-green deployment switches traffic between two full environments, so rollback means switching back."},
{d:B, q:"A new version is released first to the internal team, then to early adopters and finally to all customers, with validation between the steps. Which approach is this?",
 o:["Ring-based deployment", "Blue-green deployment", "Recreate deployment", "A/B testing"],
 e:"Rings expose a release to progressively larger groups to limit the impact of a problem. A/B testing compares variants to measure user behaviour."},
{d:B, q:"Version 3.2 is in production from the branch `release/3.2`. A critical bug is found, and `main` already contains unfinished work for version 3.3. What should you do?",
 o:["Fix the bug in a branch from `release/3.2`, deploy it, and bring the fix into `main`", "Deploy `main` to production immediately", "Wait for version 3.3", "Revert all 3.3 commits on `main` and deploy `main`"],
 e:"A hotfix is made against the code that is in production, and is then carried into `main` so that the next version does not reintroduce the bug."},
{d:B, q:"After each deployment to Azure App Service, the first users get slow responses while the app starts. You must avoid this without causing downtime. What should you do?",
 o:["Deploy to a staging slot and swap it with production", "Deploy directly to the production slot outside business hours", "Scale up the App Service plan before each deployment", "Restart the app after each deployment"],
 e:"A swap warms up the instances of the source slot before production traffic is routed to them."},
{d:B, q:"A pipeline must verify that a web application handles 10,000 concurrent users, and must fail if the average response time exceeds a threshold. What should you use?",
 o:["Azure Load Testing with test fail criteria", "An Application Insights availability test", "Unit tests with a code coverage threshold", "An Azure Monitor action group"],
 e:"Azure Load Testing runs high-scale load from a pipeline and fails the run when the defined fail criteria are not met."},
{d:B, q:"A Node.js test run writes its results in JUnit XML format. The results must appear on the Tests tab of the pipeline run. Which task should you add?",
 o:["`PublishTestResults` with the JUnit format", "`PublishCodeCoverageResults`", "`PublishPipelineArtifact`", "`ArchiveFiles`"],
 e:"`PublishTestResults` uploads results in formats such as JUnit, NUnit, VSTest and xUnit to the run."},
{d:B, q:"Build tools that are not NuGet, npm, Maven or Python packages must be versioned and shared through Azure Artifacts. What should you use?",
 o:["Universal Packages", "A feed view", "Upstream sources", "A secure file"],
 e:"A Universal Package stores an arbitrary set of files in a feed under a name and version."},
{d:B, q:"A pipeline runs `dotnet restore` against a private Azure Artifacts feed and fails with a 401 error. What should you add before the restore step?",
 o:["The `NuGetAuthenticate` task", "The `UseDotNet` task", "The `Cache` task", "A personal access token committed in `nuget.config`"],
 e:"`NuGetAuthenticate` supplies credentials for Azure Artifacts feeds to NuGet, `dotnet` and MSBuild for the rest of the job."},
{d:B, q:"A pipeline fails with a 403 error when it publishes a package to an Azure Artifacts feed. What should you do?",
 o:["Grant the project build service identity the Feed Publisher (Contributor) role on the feed", "Grant the project build service identity the Feed Reader role on the feed", "Add the feed as an upstream source", "Promote the package to the `@Release` view"],
 e:"Pipelines publish as the build service identity, which needs at least the Feed Publisher (Contributor) role."},
{d:B, q:"Version 1.2.0 of a package in an Azure Artifacts feed contains a bug. What should you do?",
 o:["Publish the fix as 1.2.1 and deprecate or unlist 1.2.0", "Publish the fixed package again as 1.2.0", "Delete 1.2.0 and publish the fixed package as 1.2.0", "Edit the content of the package in the feed"],
 e:"Package versions are immutable. A version number cannot be reused, even after the version is deleted."},
{d:B, q:"Pipeline runs must be numbered like `1.0.20261112.3`, where the last number increases for each run on the same day. What should you add to the YAML file?",
 o:["`name: 1.0.$(Date:yyyyMMdd)$(Rev:.r)`", "`name: 1.0.$(Build.BuildId)`", "`variables: version: 1.0.$(Date:yyyyMMdd)`", "`trigger: 1.0.$(Rev:.r)`"],
 e:"`name` sets the run number format. `$(Rev:.r)` is a counter that restarts when the rest of the name changes."},
{d:B, q:"In a GitHub Actions workflow, the `deploy` job must start only after the `build` and `test` jobs succeed. What should you add to `deploy`?",
 o:["`needs: [build, test]`", "`if: always()`", "`runs-on: [build, test]`", "`concurrency: deploy`"],
 e:"Jobs run in parallel unless `needs` declares the jobs that must finish successfully first."},
{d:B, q:"When a new commit is pushed to a branch, a GitHub Actions deployment run that is still in progress for that branch must be cancelled, so that only the newest run continues. What should you configure?",
 o:["A `concurrency` group with `cancel-in-progress: true`", "A `needs` dependency", "A matrix strategy", "A `timeout-minutes` value"],
 e:"Only one run in a concurrency group is active at a time, and `cancel-in-progress` cancels the running one when a new one starts."},
{d:B, q:"A GitHub Actions job that deploys to production must wait for approval from the release managers.", n:2,
 o:["Create a `production` environment with the release managers as required reviewers", "Set `environment: production` on the deployment job", "Add the release managers to `CODEOWNERS`", "Add a `workflow_call` trigger", "Store the approval in a repository secret"],
 e:"A job that references an environment waits until that environment's protection rules, such as required reviewers, are satisfied."},
{d:B, q:"A deployment credential must be available only to GitHub Actions jobs that deploy to the `production` environment, and only after that environment's protection rules pass. Where should you store it?",
 o:["As an environment secret", "As a repository secret", "As an organization secret", "As a repository variable"],
 e:"Environment secrets are released only to jobs that reference the environment and pass its protection rules."},
{d:B, q:"Three setup steps are repeated in many jobs across many GitHub Actions workflows. You want to call them as a single step inside a job. What should you create?",
 o:["A composite action", "A reusable workflow", "A matrix strategy", "A workflow template"],
 e:"A composite action bundles steps and is used as one step in a job. A reusable workflow is called as a whole job."},
{d:B, q:"A GitHub Actions workflow must be started manually from the Actions tab, with the target environment chosen from a list. What should you use?",
 o:["A `workflow_dispatch` trigger with a `choice` input", "A `workflow_call` trigger", "A `push` trigger with a path filter", "A `schedule` trigger"],
 e:"`workflow_dispatch` enables manual runs and can define typed inputs, including `choice` with a list of options."},
{d:B, q:"A step with the ID `ver` in a GitHub Actions job must expose a value that later steps read as `steps.ver.outputs.version`. What should the step do?",
 o:["Append `version=1.2.3` to the file at `$GITHUB_OUTPUT`", "Append `version=1.2.3` to the file at `$GITHUB_ENV`", "Append `version=1.2.3` to the file at `$GITHUB_STEP_SUMMARY`", "Run `export version=1.2.3`"],
 e:"Step outputs are written to `$GITHUB_OUTPUT`. `$GITHUB_ENV` sets environment variables for later steps instead."},
{d:B, q:"Approved Bicep modules must be shared across the organization with versions and be referenced from other Bicep files. What should you do?",
 o:["Publish the modules to a private Bicep registry in Azure Container Registry", "Copy the module files into every repository", "Store the modules in a variable group", "Upload the modules as secure files"],
 e:"A private Bicep registry is hosted in Azure Container Registry. Modules are published with a tag and referenced with the `br:` scheme."},
{d:B, q:"A Bicep file has an administrator password parameter. The value must not appear in the deployment history or in logs. What should you do?",
 o:["Add the `@secure()` decorator to the parameter", "Add the `@description()` decorator to the parameter", "Give the parameter a default value", "Declare the value as a variable instead"],
 e:"Secure parameters are not stored in the deployment history and are not logged."},
{d:B, q:"A Bicep file must create resource groups and deploy resources into them.", n:2,
 o:["Set `targetScope = 'subscription'` in the file", "Deploy the file with `az deployment sub create`", "Deploy the file with `az deployment group create`", "Set `targetScope = 'tenant'` in the file", "Use Complete deployment mode"],
 e:"Resource groups are created at subscription scope. Resources inside them are deployed through modules scoped to the resource group."},
{d:B, q:"Several pipelines and engineers run Terraform against the same Azure environment. The state must be shared and protected against concurrent changes. What should you do?",
 o:["Configure the `azurerm` backend to store the state in an Azure Storage account", "Commit the `terraform.tfstate` file to the Git repository", "Keep the state file on each engineer's machine", "Publish the state file as a pipeline artifact"],
 e:"The Azure Storage backend keeps the state in one place and locks it with a blob lease during operations."},
{d:B, q:"A set of Azure resources in several resource groups must be managed as one unit. Resources removed from the template must be deleted, and nobody may change the managed resources outside the deployment. What should you use?",
 o:["An Azure deployment stack with deny settings", "Incremental deployment mode", "A resource tag", "A what-if operation"],
 e:"A deployment stack tracks the resources it manages, can delete those that leave the template, and can block changes to them with deny settings."},
{d:B, q:"Servers are managed with PowerShell Desired State Configuration. When a setting drifts, the node must log it and restore the desired state automatically. Which configuration mode should you use?",
 o:["`ApplyAndAutoCorrect`", "`ApplyAndMonitor`", "`ApplyOnly`", "`Push`"],
 e:"`ApplyAndAutoCorrect` reapplies the configuration when drift is found. `ApplyAndMonitor` only reports drift, and `ApplyOnly` does not check again."},
{d:B, q:"The configuration of several AKS clusters must be reconciled continuously from a Git repository, so that manual changes in a cluster are reverted. What should you use?",
 o:["GitOps with the Flux extension", "A pipeline that runs `kubectl apply` once a week", "Helm charts stored on a file share", "Azure Deployment Environments"],
 e:"Flux runs in the cluster, pulls the desired state from Git and corrects drift continuously."},
{d:B, q:"An Azure Container Apps application must send 20 percent of traffic to a new version and 80 percent to the current one. What should you do?",
 o:["Use multiple revision mode and set traffic weights on the revisions", "Use single revision mode", "Create a deployment slot", "Scale the new version to 20 percent of the replicas"],
 e:"In multiple revision mode several revisions are active at once, and ingress traffic is split between them by percentage."},
{d:B, q:"A container image contains the SDK and build tools, which makes it large and widens its attack surface. Only the compiled output is needed at run time. What should you do?",
 o:["Use a multi-stage Dockerfile that copies the output into a runtime base image", "Compress the image with `docker save`", "Add the SDK folder to `.gitignore`", "Tag the image as `latest`"],
 e:"In a multi-stage build, the final stage starts from a small runtime image and copies only the artifacts from the build stage."},
{d:B, q:"A pipeline must build a container image and push it to Azure Container Registry from an agent that has no Docker engine. What should you use?",
 o:["`az acr build`", "`docker build`", "`az acr import`", "`az acr login`"],
 e:"`az acr build` sends the build context to ACR Tasks, which builds the image in Azure and pushes it to the registry."},
{d:B, q:"A compliance step must be injected automatically into every job of every pipeline in the organization, without editing the pipelines. What should you use?",
 o:["A pipeline decorator", "A task group", "A variable group", "A service hook"],
 e:"Pipeline decorators are installed through an extension and add steps to the start or end of every job."},
{d:B, q:"A release pipeline must start only when a Git tag that begins with `v` is pushed. What should you configure?",
 o:["A CI `trigger` with a `tags` filter that includes `v*`", "A `pr` trigger for `v*`", "A `schedules` entry named `v*`", "A `paths` filter that includes `v*`"],
 e:"The CI trigger supports `tags` include and exclude filters in addition to branch and path filters."},
{d:B, q:"Commits arrive on `main` faster than the pipeline finishes. You want one run at a time, with the changes that arrive during a run built together in the next run. What should you set?",
 o:["`batch: true` on the CI trigger", "`always: true` on a schedule", "`trigger: none`", "`fetchDepth: 1` on the `checkout` step"],
 e:"With `batch: true`, the pipeline waits for the active run to finish and then starts one run that contains all the changes not yet built."},
{d:B, q:"Deployments to the production environment may start only on weekdays between 08:00 and 16:00. What should you add to the environment?",
 o:["A Business hours check", "An Exclusive lock check", "A Required template check", "A branch control check"],
 e:"The Business hours check holds a stage until the current time is inside the configured window."},
{d:B, q:"Before deploying to production, a pipeline must wait until an external change management system reports that the change ticket is approved. What should you add to the production environment?",
 o:["An Invoke REST API check", "A Business hours check", "An Exclusive lock check", "A branch control check"],
 e:"The Invoke REST API check calls an external endpoint and lets the stage proceed only on a successful response or callback."},
{d:B, q:"When a run is queued manually, the user must pick the target region from a fixed list. What should you define in the YAML file?",
 o:["A runtime parameter with a `values` list", "A secret variable", "A variable group", "A `demands` entry"],
 e:"Runtime parameters are typed, can restrict input to a list of `values`, and are shown in the run dialog."},
{d:B, q:"A script in a pipeline must call the Azure DevOps REST API. You must not create or store a personal access token. What should the script use?",
 o:["`$(System.AccessToken)`, mapped into the step through `env`", "`$(Build.BuildId)`", "`$(Agent.Name)`", "A password stored in the YAML file"],
 e:"`System.AccessToken` is the job's own OAuth token. It lasts for the job and must be mapped into scripts explicitly."},
{d:B, q:"A company is moving many Jenkins and Azure Pipelines definitions to GitHub Actions. It wants to audit them, forecast usage and convert them automatically where possible. What should it use?",
 o:["GitHub Actions Importer", "GitHub Importer", "Dependabot", "The Azure Pipelines app for GitHub"],
 e:"GitHub Actions Importer can audit, forecast, dry-run and migrate pipelines from other CI systems. GitHub Importer moves source repositories."},
{d:C, q:"A GitHub Actions workflow uses third-party actions. A compromised release of an action must not be able to change the code that your workflow runs. What should you do?",
 o:["Pin each action to a full-length commit SHA", "Pin each action to a major version tag such as `v4`", "Pin each action to the `main` branch", "Store the action name in a secret"],
 e:"Tags and branches can be moved to different code. A full commit SHA always refers to the same code."},
{d:C, q:"A GitHub Actions workflow only needs to read the repository contents. You must limit what its `GITHUB_TOKEN` can do. What should you add to the workflow?",
 o:["A `permissions` block that grants only `contents: read`", "A personal access token with the `repo` scope", "A `concurrency` group", "An `env` entry that sets `GITHUB_TOKEN` to an empty value"],

console.assert(Q.every(q => q.o.length > (q.n || 1) && new Set(q.o).size === q.o.length && q.e), "bad question data");

const app = document.getElementById("app");
const fmt = s => s.replace(/[&<>]/g, c => `&#${c.charCodeAt()};`).replace(/`([^`]+)`/g, "<code>$1</code>");
const shuffle = a => {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; }
  return a;
};
let qs, i, tally;

function start() { qs = shuffle([...Q]); i = 0; tally = {}; show(); }

function show() {
  const q = qs[i];
  if (!q) return done();
  const n = q.n || 1, opts = shuffle(q.o.map((t, k) => ({ t, ok: k < n })));
  app.innerHTML = `<small>Question ${i + 1} of ${qs.length} · ${q.d}</small>
<form><fieldset><legend>${fmt(q.q)}${n > 1 ? ` Which ${n} actions should you perform?` : ""}</legend>${opts.map(o =>
    `<label><input type="${n > 1 ? "checkbox" : "radio"}" name="o"> ${fmt(o.t)}</label>`).join("")}</fieldset>
<button>Check</button></form><p role="status"></p>`;
  const form = app.querySelector("form"), inputs = [...form.querySelectorAll("input")];
  form.onsubmit = e => {
    e.preventDefault();
    if (!inputs.some(x => x.checked)) return;
    const ok = inputs.every((x, k) => x.checked === opts[k].ok);
    inputs.forEach((x, k) => {
      x.disabled = true;
      if (opts[k].ok) x.parentNode.className = "ok";
      else if (x.checked) x.parentNode.className = "bad";
    });
    const t = tally[q.d] ||= [0, 0];
    t[0] += ok; t[1]++;
    app.querySelector("[role=status]").innerHTML = `<b>${ok ? "Correct." : "Incorrect."}</b> ${fmt(q.e)}`;
    form.querySelector("button").textContent = i + 1 < qs.length ? "Next" : "Finish";
    form.onsubmit = e => { e.preventDefault(); i++; show(); };
  };
}

function done() {
  const right = Object.values(tally).reduce((s, t) => s + t[0], 0), pct = Math.round(100 * right / qs.length);
  app.innerHTML = `<h1>${pct}% – ${pct >= 70 ? "pass" : "keep studying"}</h1>
<p>${right} of ${qs.length} correct. The real exam needs 700 of 1000.</p>
<ul>${Object.entries(tally).map(([d, t]) => `<li>${d}: ${t[0]}/${t[1]}</li>`).join("")}</ul>
<button onclick="start()">Restart</button>`;
}

start();
</script>
